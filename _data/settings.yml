#-------------------------------
# Site Settings
title: Brian Beyond
description: A place to capture memories and experiences from adventures around the world. Mountains, marathons, global adventures and big goals. All documented here to share the preparation, lessons, and moments that make the journey meaningful. Follow for stories of adventure racing, kayaking, mountaineering, running, thru-hiking, triathlon, world travel & off the trail adventures. 
logo: '/images/logolight.png'
logo_dark: '/images/logodark.png'
color_scheme: auto # You can choose three modes auto, light, and dark. By default, the auto mode is set, which means the user can choose the light or dark mode themself.


