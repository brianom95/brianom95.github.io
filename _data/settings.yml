#-------------------------------
# Hero Settings
hero:
  enable: true
  hero_title: Welcome to my Blog
  hero_description: Capturing memories from around the world. Like marathons on every continent, climbing the world’s highest peaks, backpacking over 75 countries, an Ironman triathlon, multiday hikes, whitewater kayaking, bike touring, and lots of challenges in between. This is my story, and everything I've learned along the way.
  hero_image: '/images/01.jpg'


